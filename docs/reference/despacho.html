<style>
/* Layout: app shell com seletor de perfil; empresa em painel largo, prestador e cliente em moldura de celular (lado a lado por padrão) */
:root {
  --bg: #eceee9;
  --surface: #ffffff;
  --surface-2: #f5f6f2;
  --ink: #18211e;
  --muted: #5b6863;
  --line: #d6dcd6;
  --brand: #0f4b44;
  --brand-ink: #f2f7f5;
  --accent: #e3a20f;
  --accent-ink: #231800;
  --st-open: #2462a8;
  --st-prog: #9a6400;
  --st-done: #2b7a4b;
  --st-cancel: #9c3a3a;
  --map-bg: #e9ede6;
  --map-block: #dfe5dc;
  --map-street: #ffffff;
  --map-ave: #f6e7bd;
  --shadow: 0 1px 2px rgb(20 30 28 / .06), 0 8px 24px rgb(20 30 28 / .07);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1412; --surface: #172019; --surface-2: #1d2722; --ink: #e5ece8; --muted: #94a39d;
    --line: #2b3732; --brand: #1d6b61; --brand-ink: #eef7f4; --accent: #f0b52c; --accent-ink: #231800;
    --st-open: #82b2ea; --st-prog: #f0b952; --st-done: #6fcf97; --st-cancel: #e58f8f;
    --map-bg: #141c18; --map-block: #18221d; --map-street: #26322c; --map-ave: #4a4126;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1412; --surface: #172019; --surface-2: #1d2722; --ink: #e5ece8; --muted: #94a39d;
  --line: #2b3732; --brand: #1d6b61; --brand-ink: #eef7f4; --accent: #f0b52c; --accent-ink: #231800;
  --st-open: #82b2ea; --st-prog: #f0b952; --st-done: #6fcf97; --st-cancel: #e58f8f;
  --map-bg: #141c18; --map-block: #18221d; --map-street: #26322c; --map-ave: #4a4126;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 14px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 1120px; margin-inline: auto; display: grid; gap: 20px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: 1.6rem; }
h2 { font-size: 1.15rem; }
h3 { font-size: 1rem; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .82rem; }
.mono { font-family: var(--f-mono); font-size: .8rem; font-variant-numeric: tabular-nums; }
.eyebrow { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }

.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; }
.brand { display: flex; align-items: center; gap: 12px; }
.logo { width: 40px; height: 40px; border-radius: 10px; background: var(--brand); color: var(--accent); display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 1.3rem; }
.tabs { display: flex; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; flex-wrap: wrap; }
.tab { border: 0; background: transparent; color: var(--muted); font: 600 .9rem var(--f-body); padding: 8px 14px; border-radius: 9px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.tab[aria-selected="true"] { background: var(--brand); color: var(--brand-ink); }
.tab:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, .attach:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font: 600 .72rem var(--f-mono); display: inline-grid; place-items: center; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.stack { display: grid; gap: 10px; }
button.btn { font: 600 .86rem var(--f-body); border-radius: 9px; padding: 8px 14px; cursor: pointer; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); display: inline-flex; align-items: center; gap: 6px; justify-content: center; }
button.btn:hover { border-color: var(--muted); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button.primary:hover { filter: brightness(1.05); border-color: var(--accent); }
button.dark { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
button.ghost { background: transparent; }
button.danger { color: var(--st-cancel); background: transparent; }
button.sm { padding: 5px 10px; font-size: .8rem; }
button:disabled { opacity: .5; cursor: not-allowed; }
label { display: grid; gap: 5px; font-weight: 500; font-size: .84rem; }
input, select, textarea { font: 400 .92rem var(--f-body); color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; width: 100%; min-width: 0; }
textarea { resize: vertical; min-height: 64px; }
.checks { display: flex; flex-wrap: wrap; gap: 6px; }
.check { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 999px; font-weight: 500; cursor: pointer; }
.check input { width: auto; accent-color: var(--brand); }

.chip { display: inline-flex; align-items: center; gap: 6px; font-size: .74rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.tone-open   { color: var(--st-open);   background: color-mix(in srgb, var(--st-open) 13%, transparent); }
.tone-prog   { color: var(--st-prog);   background: color-mix(in srgb, var(--st-prog) 14%, transparent); }
.tone-done   { color: var(--st-done);   background: color-mix(in srgb, var(--st-done) 14%, transparent); }
.tone-cancel { color: var(--st-cancel); background: color-mix(in srgb, var(--st-cancel) 13%, transparent); }
.cat { font-size: .74rem; padding: 2px 8px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.star { color: var(--accent); font-weight: 600; white-space: nowrap; }
.empty { padding: 18px; border: 1px dashed var(--line); border-radius: 10px; color: var(--muted); text-align: center; font-size: .86rem; }
.note { font-size: .82rem; color: var(--muted); padding: 10px 12px; border-radius: 10px; background: var(--surface-2); }

/* Admin */
.admin-bar { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; }
.admin-bar select { width: auto; font-weight: 600; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.stat b { display: block; font: 700 1.5rem var(--f-display); font-variant-numeric: tabular-nums; }
.admin-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.req { display: grid; gap: 8px; padding: 12px 0; border-top: 1px solid var(--line); }
.req:first-of-type { border-top: 0; padding-top: 0; }
.req-title { font-weight: 600; }
.assign { display: flex; gap: 6px; flex-wrap: wrap; }
.assign select { width: auto; flex: 1 1 160px; padding: 6px 8px; font-size: .84rem; }
.prov { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 10px 0; border-top: 1px solid var(--line); }
.prov:first-of-type { border-top: 0; padding-top: 0; }
.prov.off { opacity: .55; }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: color-mix(in srgb, var(--brand) 18%, var(--surface)); color: var(--ink); display: grid; place-items: center; font-weight: 700; font-size: .8rem; flex: none; }
.avatar.lg { width: 46px; height: 46px; font-size: 1rem; }

/* Phones */
.split { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; align-items: start; }
.mobile-area { display: grid; gap: 12px; justify-items: center; min-width: 0; }
.login-as { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
.login-as select { width: auto; max-width: 100%; }
.phone { width: 100%; max-width: 400px; background: var(--surface); border: 1px solid var(--line); border-radius: 30px; overflow: hidden; box-shadow: var(--shadow); display: grid; }
.phone-head { background: var(--brand); color: var(--brand-ink); padding: 18px 18px 16px; display: grid; gap: 4px; }
.phone-head h2 { color: var(--brand-ink); }
.phone-head .sub { opacity: .8; font-size: .82rem; }
.phone-body { padding: 16px; display: grid; gap: 18px; background: var(--surface); }
.section { display: grid; gap: 10px; }
.card { border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 9px; background: var(--surface); min-width: 0; }
.card.hot { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, var(--surface)); }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: .82rem; font-weight: 600; cursor: pointer; background: rgb(255 255 255 / .12); border: 0; color: var(--brand-ink); padding: 6px 10px; border-radius: 999px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: #9aa5a1; }
.dot.on { background: #5fe08f; box-shadow: 0 0 0 3px rgb(95 224 143 / .25); }
.notif { display: grid; grid-template-columns: 8px 1fr; gap: 10px; align-items: start; font-size: .86rem; padding: 8px 0; border-top: 1px solid var(--line); }
.notif:first-child { border-top: 0; }
.notif i { width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; background: var(--line); }
.notif.unread i { background: var(--accent); }
.notif.near { font-weight: 600; }
.timeline { display: flex; gap: 4px; }
.timeline span { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
.timeline span.on { background: var(--st-done); }
.company-pick { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.person { display: flex; gap: 12px; align-items: center; }
.person-box { border: 1px solid var(--line); border-radius: 12px; padding: 10px; background: var(--surface-2); display: grid; gap: 10px; }

/* Map */
.map { position: relative; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
.map canvas { display: block; width: 100%; height: 190px; }
.map-info { position: absolute; left: 8px; right: 8px; bottom: 8px; display: flex; justify-content: space-between; gap: 8px; pointer-events: none; }
.map-info span { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 3px 8px; font-size: .76rem; font-weight: 600; font-variant-numeric: tabular-nums; }

/* Chat */
.chat { display: grid; gap: 10px; }
.chat-head { display: flex; gap: 8px; align-items: center; min-width: 0; }
.chat-head > div { min-width: 0; }
.chat-log { display: flex; flex-direction: column; gap: 8px; max-height: 380px; min-height: 220px; overflow-y: auto; padding: 10px; background: var(--surface-2); border-radius: 12px; border: 1px solid var(--line); }
.msg { max-width: 82%; align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: 12px 12px 12px 4px; padding: 7px 10px; display: grid; gap: 5px; }
.msg.me { align-self: flex-end; background: var(--brand); color: var(--brand-ink); border-color: var(--brand); border-radius: 12px 12px 4px 12px; }
.msg img { border-radius: 8px; max-width: 100%; max-height: 220px; object-fit: cover; display: block; }
.msg p { overflow-wrap: anywhere; }
.msg .time { font-size: .68rem; opacity: .7; justify-self: end; font-variant-numeric: tabular-nums; }
.chat-form { display: flex; gap: 6px; align-items: center; }
.chat-form input[type="text"] { flex: 1; }
.attach { width: 38px; height: 38px; flex: none; border-radius: 9px; border: 1px solid var(--line); background: var(--surface-2); display: grid; place-items: center; cursor: pointer; color: var(--ink); }
.attach svg { width: 18px; height: 18px; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Rating */
.rate { display: grid; gap: 8px; }
.stars { display: inline-flex; flex-direction: row-reverse; justify-content: flex-end; gap: 2px; }
.stars input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.stars label { font-size: 1.7rem; line-height: 1; color: var(--line); cursor: pointer; display: block; }
.stars input:checked ~ label, .stars label:hover, .stars label:hover ~ label { color: var(--accent); }
.stars input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

.toasts { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; z-index: 20; max-width: min(360px, calc(100vw - 32px)); }
.toast { background: var(--ink); color: var(--bg); padding: 11px 14px; border-radius: 11px; font-size: .86rem; box-shadow: var(--shadow); animation: up .25s ease-out; }
.toast b { color: var(--accent); }
@keyframes up { from { transform: translateY(8px); opacity: .4; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } }

@media (max-width: 880px) {
  .admin-grid, .split { grid-template-columns: minmax(0, 1fr); }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 440px) {
  .phone { border-radius: 20px; }
  .tab { padding: 8px 10px; }
  .phone-body { padding: 12px; }
}
</style>

/* Foto de exemplo no chat, desenhada na hora */
function sampleImage() {
  const cv = document.createElement('canvas'); cv.width = 360; cv.height = 240;
  const g = cv.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 240); grad.addColorStop(0, '#efe6d6'); grad.addColorStop(1, '#d9ccb4');
  g.fillStyle = grad; g.fillRect(0, 0, 360, 240);
  g.fillStyle = '#f7f3ea'; g.fillRect(0, 0, 360, 40);

/* posição simulada ao longo da rota */
function posAt(d) {
  let left = d;
  for (let i = 1; i < ROUTE.length; i++) {
    const a = ROUTE[i - 1], b = ROUTE[i], len = Math.hypot(b.x - a.x, b.y - a.y);
    if (left <= len) return { x: a.x + (b.x - a.x) * left / len, y: a.y + (b.y - a.y) * left / len };
    left -= len;
  }
  return { ...ROUTE[ROUTE.length - 1] };
}
const simD = r => r.status === 'chegou' ? ROUTE_LEN : (r.sim ? r.sim.d : 0);
const etaMin = r => Math.max(1, Math.ceil((ROUTE_LEN - simD(r)) / SPEED_M_MIN));
function etaText(r) {
  if (r.status === 'chegou') return ['No endereço', ''];
  const p = posAt(simD(r));
  if (r.status === 'confirmado') return ['Aguardando saída', fmtDist(Math.hypot(p.x, p.y))];
  return [`Chega em ~${etaMin(r)} min`, fmtDist(Math.hypot(p.x, p.y))];
}

      ${r.status === 'concluido' ? rateForm('c', r) : ''}
      <div class="row">${chatButton('c', r)}</div>`;
  }
  return `<div class="card ${r.status === 'aguardando_cliente' ? 'hot' : ''}">
    <div class="row spread"><span class="mono muted">#${r.id} · ${ago(r.criado)}</span>${chip(r.status)}</div>
    <div style="font-weight:600">${esc(r.titulo)}</div>
    <div class="small muted">${esc(co.nome)} · ${esc(r.cat)}</div>
    ${r.status !== 'cancelado' ? `<div class="timeline" aria-hidden="true">${[0, 1, 2, 3, 4, 5].map(i => `<span class="${i <= idx ? 'on' : ''}"></span>`).join('')}</div>` : ''}
    ${body}
  </div>`;
}

function renderClient() {
  const s = S.session;
  const top = `<div class="login-as">
      <span class="small muted">Cliente</span>
      <select id="client-select" aria-label="Entrar como cliente">${S.clients.map(u => `<option value="${u.id}" ${u.id === s.clientId ? 'selected' : ''}>${esc(u.nome)}</option>`).join('')}${s.clientId ? '' : '<option value="" selected>Novo cadastro</option>'}</select>
      <button class="btn sm" data-act="client-logout">Novo cadastro</button>
    </div>`;

  if (!s.clientId) {
    return `<div class="mobile-area">${top}
      <div class="phone">
        <div class="phone-head"><span class="sub">Bem-vindo ao Despacho</span><h2>Crie sua conta</h2></div>
        <div class="phone-body">
          <form id="form-signup" class="stack">
            <label>Nome<input id="su-nome" required placeholder="Seu nome completo"></label>
            <label>Celular<input id="su-tel" required placeholder="(41) 99999-0000"></label>
            <label>E-mail<input id="su-email" type="email" placeholder="voce@email.com"></label>
            <button class="btn primary" type="submit">Criar conta</button>
            <p class="small muted">Depois você escolhe quais empresas vão atender você.</p>
          </form>
        </div>
      </div></div>`;
  }

  const me = client(s.clientId);
  const chatReq = s.chat.c && req(s.chat.c);
  let body;
  if (chatReq && chatReq.clientId === me.id) {
    body = chatScreen('c', chatReq);
  } else {
    const minhas = S.companies.filter(c => me.empresas.includes(c.id));
    const pedidos = S.requests.filter(r => r.clientId === me.id).sort((a, b) => b.criado - a.criado);
    const firstCo = minhas[0];
    body = `
      ${notifList(me.id, 'c')}
      <div class="section"><h3>Meus pedidos</h3>${pedidos.length ? pedidos.map(clientCard).join('') : '<div class="empty">Você ainda não fez nenhum pedido.</div>'}</div>
      <div class="section">
        <h3>Pedir um serviço</h3>
        ${minhas.length ? `<form id="form-req" class="stack">
          <label>Empresa<select id="nr-co">${minhas.map(c => `<option value="${c.id}">${esc(c.nome)}</option>`).join('')}</select></label>
          <label>Categoria<select id="nr-cat">${firstCo.cats.map(x => `<option>${esc(x)}</option>`).join('')}</select></label>
          <label>O que precisa ser feito<input id="nr-titulo" required placeholder="Ex.: Trocar chuveiro queimado"></label>
          <label>Detalhes<textarea id="nr-desc" placeholder="Opcional: marca, tamanho, quando começou..."></textarea></label>
          <label>Endereço<input id="nr-end" required value="Rua XV de Novembro, 820, Centro"></label>
          <button class="btn primary" type="submit">Enviar pedido</button>
        </form>` : '<div class="empty">Escolha pelo menos uma empresa abaixo para pedir serviços.</div>'}
      </div>
      <div class="section">
        <h3>Empresas que atendem você</h3>
        ${S.companies.map(c => {
          const on = me.empresas.includes(c.id);
          return `<div class="card company-pick">
            <div style="min-width:0"><div style="font-weight:600">${esc(c.nome)}</div><div class="small muted">${esc(c.cidade)} · ${c.cats.map(esc).join(', ')}</div></div>
            <button class="btn sm ${on ? '' : 'dark'}" data-act="toggle-co" data-v="${c.id}">${on ? 'Remover' : 'Escolher'}</button>
          </div>`;
        }).join('')}
      </div>`;
  }

  return `<div class="mobile-area">${top}
    <div class="phone">
      <div class="phone-head">
        <span class="sub">${me.empresas.length} empresa(s) escolhida(s)</span>
        <h2>Olá, ${esc(first(me.nome))}</h2>
        <span class="sub">Sua nota: ★ ${avg(me).toFixed(1).replace('.', ',')} · ${me.qtd} avaliações</span>
      </div>
      <div class="phone-body">${body}</div>
    </div></div>`;
}

/* =================== render =================== */
let pending = false;
function render() {
  pending = false;
  const r = S.session.role;
  $('#view').innerHTML = r === 'admin' ? renderAdmin()
    : r === 'provider' ? renderProvider()
    : r === 'client' ? renderClient()
    : `<div class="split">${renderProvider()}${renderClient()}</div>`;
  renderTabs();
  document.querySelectorAll('.chat-log').forEach(el => { el.scrollTop = el.scrollHeight; });
  drawMaps();
}
/* não apaga o que a pessoa está digitando: adia o redesenho completo */
function softRender() {
  const a = document.activeElement;
  if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA') && a.type !== 'radio' && a.value) { pending = true; renderTabs(); return; }
  render();
}
document.addEventListener('focusout', () => { setTimeout(() => { if (pending && !document.activeElement?.value) render(); }, 0); });

/* =================== mapa =================== */
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function drawMaps() { document.querySelectorAll('canvas[data-map]').forEach(drawMap); }
function drawMap(cv) {
  const r = req(cv.dataset.map); if (!r) return;
  const w = cv.clientWidth, h = cv.clientHeight; if (!w) return;
  const dpr = window.devicePixelRatio || 1;
  if (cv.width !== Math.round(w * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const xmin = -2600, xmax = 450, ymin = -350, ymax = 1800;
  const sc = Math.min(w / (xmax - xmin), h / (ymax - ymin));
  const ox = (w - (xmax - xmin) * sc) / 2, oy = (h - (ymax - ymin) * sc) / 2;
  const X = x => ox + (x - xmin) * sc, Y = y => oy + (ymax - y) * sc;

  g.fillStyle = cssv('--map-bg'); g.fillRect(0, 0, w, h);
  g.fillStyle = cssv('--map-block');
  for (let x = -2750; x < 600; x += 250) for (let y = -500; y < 1900; y += 250) g.fillRect(X(x) + 4, Y(y + 250) + 4, 250 * sc - 8, 250 * sc - 8);
  g.strokeStyle = cssv('--map-street'); g.lineWidth = 3;
  g.beginPath();
  for (let x = -2750; x <= 750; x += 250) { g.moveTo(X(x), 0); g.lineTo(X(x), h); }
  for (let y = -500; y <= 2000; y += 250) { g.moveTo(0, Y(y)); g.lineTo(w, Y(y)); }
  g.stroke();
  g.strokeStyle = cssv('--map-ave'); g.lineWidth = 6;
  g.beginPath(); g.moveTo(X(-2250), 0); g.lineTo(X(-2250), h); g.moveTo(0, Y(250)); g.lineTo(w, Y(250)); g.stroke();

  // raio de proximidade
  g.save();
  g.fillStyle = cssv('--accent'); g.globalAlpha = .1;
  g.beginPath(); g.arc(X(0), Y(0), NEAR_M * sc, 0, Math.PI * 2); g.fill();
  g.globalAlpha = .8; g.strokeStyle = cssv('--accent'); g.setLineDash([4, 4]); g.lineWidth = 1.5; g.stroke();
  g.restore();

  // rota: trecho restante tracejado, percorrido sólido
  const d = simD(r), pos = posAt(d);
  g.lineWidth = 3; g.lineCap = 'round'; g.lineJoin = 'round';
  g.strokeStyle = cssv('--muted'); g.setLineDash([2, 6]);
  g.beginPath(); g.moveTo(X(pos.x), Y(pos.y));
  let acc = 0;
  for (let i = 1; i < ROUTE.length; i++) {
    acc += Math.hypot(ROUTE[i].x - ROUTE[i - 1].x, ROUTE[i].y - ROUTE[i - 1].y);
    if (acc > d) g.lineTo(X(ROUTE[i].x), Y(ROUTE[i].y));
  }
  g.stroke(); g.setLineDash([]);
  g.strokeStyle = cssv('--brand'); g.beginPath(); g.moveTo(X(ROUTE[0].x), Y(ROUTE[0].y));
  acc = 0;
  for (let i = 1; i < ROUTE.length; i++) {
    acc += Math.hypot(ROUTE[i].x - ROUTE[i - 1].x, ROUTE[i].y - ROUTE[i - 1].y);
    if (acc < d) g.lineTo(X(ROUTE[i].x), Y(ROUTE[i].y)); else break;
  }
  g.lineTo(X(pos.x), Y(pos.y)); g.stroke();

  // endereço do cliente
  g.fillStyle = cssv('--brand'); g.beginPath(); g.arc(X(0), Y(0), 8, 0, Math.PI * 2); g.fill();
  g.fillStyle = cssv('--surface'); g.beginPath(); g.arc(X(0), Y(0), 3, 0, Math.PI * 2); g.fill();
  g.font = '600 11px "IBM Plex Sans", system-ui, sans-serif'; g.fillStyle = cssv('--ink'); g.textAlign = 'left';
  g.fillText('Cliente', X(0) + 12, Y(0) + 4);

  // prestador
  const px = X(pos.x), py = Y(pos.y);
  g.fillStyle = cssv('--accent'); g.globalAlpha = .25; g.beginPath(); g.arc(px, py, 14, 0, Math.PI * 2); g.fill(); g.globalAlpha = 1;
  g.beginPath(); g.arc(px, py, 8, 0, Math.PI * 2); g.fill();
  g.strokeStyle = cssv('--surface'); g.lineWidth = 2; g.stroke();
  const p = provider(r.providerId);
  if (p && r.status !== 'chegou') { g.fillStyle = cssv('--ink'); g.fillText(first(p.nome), px + 12, py - 8); }
}
function updateEtas() {
  S.requests.forEach(r => {
    if (!MAP_ON.includes(r.status)) return;
    const [a, b] = etaText(r);
    document.querySelectorAll(`[data-eta="${r.id}"]`).forEach(el => { el.textContent = a; });
    document.querySelectorAll(`[data-dist="${r.id}"]`).forEach(el => { el.textContent = b; el.hidden = !b; });
    document.querySelectorAll(`[data-dist-admin="${r.id}"]`).forEach(el => { el.textContent = `${b} do cliente`; });
  });
}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', drawMaps);
new MutationObserver(drawMaps).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
window.addEventListener('resize', drawMaps);

/* deslocamento simulado: no app real a posição vem do GPS do prestador */
setInterval(() => {
  let moved = false, ev = false;
  S.requests.forEach(r => {
    if (r.status !== 'a_caminho' || !r.sim) return;
    r.sim.d = Math.min(ROUTE_LEN, r.sim.d + 25); moved = true;
    const p = posAt(r.sim.d), dist = Math.hypot(p.x, p.y), pr = provider(r.providerId);
    if (!r.sim.perto && dist <= NEAR_M) {
      r.sim.perto = true;
      notify(r.clientId, `${pr.nome} está a menos de ${NEAR_M} m. Chega em cerca de ${etaMin(r)} min.`, r.id, 'near');
      toast(`<b>Cliente notificado:</b> ${esc(first(pr.nome))} está a menos de ${NEAR_M} m (#${r.id}).`);
      ev = true;
    }
    if (r.sim.d >= ROUTE_LEN) { setStatus(r, 'chegou'); toast(`${esc(first(pr.nome))} chegou ao endereço do pedido #${r.id}.`); ev = true; }
  });
  if (moved) { drawMaps(); updateEtas(); }
  if (ev) softRender();
}, 250);

/* =================== ações =================== */
function setStatus(r, st) {
  r.status = st;
  const p = provider(r.providerId);
  const msgs = {
    aguardando_cliente: `${p?.nome} quer atender o pedido #${r.id}. Confirme se aceita.`,
    a_caminho: `${p?.nome} saiu para o atendimento do pedido #${r.id}. Acompanhe no mapa.`,
    chegou: `${p?.nome} chegou ao endereço (#${r.id}).`,
    em_execucao: `Serviço #${r.id} em execução.`,
    concluido: `Serviço #${r.id} concluído. Avalie ${p ? first(p.nome) : 'o prestador'}.`
  };
  if (msgs[st]) notify(r.clientId, msgs[st], r.id);
  if (st === 'a_caminho') r.sim = { d: 0, perto: false };
  if (st === 'chegou' && r.sim) r.sim.d = ROUTE_LEN;
}
function reopen(r, quemRecusou) {
  if (quemRecusou) r.recusados.push(quemRecusou);
  r.providerId = null; r.status = 'aberto'; r.sim = null;
  eligible(r).forEach(p => notify(p.id, `Novo pedido de ${r.cat}: ${r.titulo}`, r.id));
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act, v = b.dataset.v, s = S.session;

  if (act === 'role') s.role = v;

  if (act === 'assign') {
    const r = req(v), pid = $('#assign-' + v).value;
    if (!pid) return;
    r.providerId = pid; r.status = 'atribuido';
    notify(pid, `Pedido #${r.id} atribuído a você: ${r.titulo}`, r.id);
    toast(`Pedido #${r.id} atribuído. <b>${esc(provider(pid).nome)}</b> foi notificado.`);
  }
  if (act === 'toggle-prov') {
    const p = provider(v); p.ativo = !p.ativo;
    toast(p.ativo ? `${esc(p.nome)} reativado.` : `${esc(p.nome)} desativado. Ele perde o acesso e deixa de receber pedidos.`);
  }
  if (act === 'toggle-disp') { const p = provider(s.providerId); p.disponivel = !p.disponivel; }

  if (act === 'accept') {
    const r = req(v), me = provider(s.providerId);
    if (r.status === 'aberto' && r.providerId && r.providerId !== me.id) { toast('Outro prestador já aceitou este pedido.'); render(); return; }
    r.providerId = me.id;
    setStatus(r, 'aguardando_cliente');
    S.notifs.forEach(n => { if (n.reqId === r.id && n.to !== r.clientId) n.lida = true; });
    toast(`Você aceitou o pedido #${r.id}. ${esc(first(client(r.clientId).nome))} vai confirmar.`);
  }
  if (act === 'decline') {
    const r = req(v), me = s.providerId;
    if (r.status === 'atribuido') reopen(r, me); else r.recusados.push(me);
    S.notifs.forEach(n => { if (n.reqId === r.id && n.to === me) n.lida = true; });
    toast(`Você recusou o pedido #${r.id}. Ele não aparece mais para você.`);
  }
  if (act === 'client-accept') {
    const r = req(v), p = provider(r.providerId);
    r.status = 'confirmado';
    notify(p.id, `${first(client(r.clientId).nome)} confirmou você no pedido #${r.id}.`, r.id);
    toast(`Você confirmou <b>${esc(p.nome)}</b>. Ele foi notificado.`);
  }
  if (act === 'client-reject') {
    const r = req(v), p = provider(r.providerId);
    notify(p.id, `O cliente escolheu outro prestador para o pedido #${r.id}.`, r.id);
    if (s.chat.p === r.id) s.chat.p = null;
    reopen(r, p.id);
    toast(`Pedido #${r.id} voltou para a fila. ${eligible(r).length} outro(s) prestador(es) foram avisados.`);
  }
  if (act === 'advance') {
    const r = req(v); setStatus(r, PNEXT[r.status][0]);
    toast(r.status === 'a_caminho'
      ? `A caminho. O cliente acompanha no mapa e é avisado a ${NEAR_M} m.`
      : `Status atualizado: <b>${STATUS[r.status].label}</b>. O cliente foi avisado.`);
  }
  if (act === 'read-all') {
    const to = v === 'p' ? s.providerId : s.clientId;
    S.notifs.forEach(n => { if (n.to === to) n.lida = true; });
  }
  if (act === 'client-logout') { s.clientId = null; s.chat.c = null; }
  if (act === 'toggle-co') {
    const me = client(s.clientId);
    me.empresas = me.empresas.includes(v) ? me.empresas.filter(x => x !== v) : [...me.empresas, v];
  }
  if (act === 'cancel') { const r = req(v); r.status = 'cancelado'; toast(`Pedido #${r.id} cancelado.`); }
  if (act === 'chat-open') { const [side, id] = v.split(':'); s.chat[side] = Number(id); }
  if (act === 'chat-close') s.chat[v] = null;

  render();
});

document.addEventListener('change', async e => {
  const t = e.target, s = S.session;
  if (t.id === 'admin-company') { s.adminCompany = t.value; render(); }
  if (t.id === 'provider-select') { s.providerId = t.value; s.chat.p = null; render(); }
  if (t.id === 'client-select') { s.clientId = t.value || null; s.chat.c = null; render(); }
  if (t.id === 'nr-co') $('#nr-cat').innerHTML = company(t.value).cats.map(x => `<option>${esc(x)}</option>`).join('');
  if (t.id && t.id.startsWith('chat-file-') && t.files[0]) {
    try {
      const img = await compress(t.files[0]);
      S.msgs.push({ reqId: Number(t.dataset.req), from: t.dataset.side, text: '', img, lida: false, t: Date.now() });
      render();
    } catch { toast('Não foi possível abrir essa imagem. Tente uma foto em JPG ou PNG.'); }
  }
});

/* reduz a foto para no máximo 1000 px antes de enviar, como o app faria antes do upload */
function compress(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, 1000 / Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        res(cv.toDataURL('image/jpeg', .8));
      };
      img.onerror = rej; img.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, s = S.session;

  if (f.id === 'form-prov') {
    const cats = [...f.querySelectorAll('input[type=checkbox]:checked')].map(i => i.value);
    if (!cats.length) { toast('Marque pelo menos uma categoria.'); return; }
    const p = { id: 'p' + Date.now(), companyId: s.adminCompany, nome: $('#np-nome').value.trim(), tel: $('#np-tel').value.trim(), cats, ativo: true, disponivel: true, soma: 0, qtd: 0 };
    S.providers.push(p);
    toast(`<b>${esc(p.nome)}</b> cadastrado. Um convite foi enviado para ${esc(p.tel)}.`);
  }
  if (f.id === 'form-signup') {
    const u = { id: 'u' + Date.now(), nome: $('#su-nome').value.trim(), tel: $('#su-tel').value.trim(), empresas: [], soma: 0, qtd: 0 };
    S.clients.push(u); s.clientId = u.id;
    toast('Conta criada. Agora escolha as empresas que vão atender você.');
  }
  if (f.id === 'form-req') {
    const r = {
      id: S.nextId++, companyId: $('#nr-co').value, clientId: s.clientId, cat: $('#nr-cat').value,
      titulo: $('#nr-titulo').value.trim(), desc: $('#nr-desc').value.trim(), endereco: $('#nr-end').value.trim(),
      status: 'aberto', providerId: null, criado: Date.now(), recusados: [], aval: { cliente: null, prestador: null }, sim: null
    };
    S.requests.push(r);
    const alvo = eligible(r);
    alvo.forEach(p => notify(p.id, `Novo pedido de ${r.cat}: ${r.titulo}`, r.id));
    toast(alvo.length
      ? `Pedido #${r.id} enviado. Notificação para <b>${alvo.map(p => esc(p.nome)).join(', ')}</b>.`
      : `Pedido #${r.id} enviado. Nenhum prestador disponível agora, a empresa vai atribuir manualmente.`);
  }
  if (f.classList.contains('chat-form')) {
    const input = f.querySelector('input[type="text"]'), text = input.value.trim();
    if (!text) return;
    input.value = '';
    S.msgs.push({ reqId: Number(f.dataset.req), from: f.dataset.side, text, img: null, lida: false, t: Date.now() });
    render();
    const again = document.getElementById(input.id); if (again) again.focus();
    return;
  }
  if (f.classList.contains('rate')) {
    const r = req(f.dataset.req), who = f.dataset.who;
    const nota = Number(f.querySelector('input[name="nota"]:checked').value);
    const coment = f.querySelector('input[type="text"]').value.trim();
    r.aval[who] = { nota, coment };
    const alvo = who === 'cliente' ? provider(r.providerId) : client(r.clientId);
    alvo.soma += nota; alvo.qtd += 1;
    notify(alvo.id, `Você recebeu uma avaliação de ${nota} estrela${nota > 1 ? 's' : ''} no pedido #${r.id}.`, r.id);
    toast(`Avaliação enviada. A nota de ${esc(first(alvo.nome))} agora é ${avg(alvo).toFixed(1).replace('.', ',')}.`);
  }
  render();
});

render();
</script>
